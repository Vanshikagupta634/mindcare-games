<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⚡ Reaction Game</h1>

        <p class="subtitle">
            Click as quickly as you can!
        </p>

        <div id="reaction-box" class="reaction-box">
            <span id="reaction-text">PRESS START</span>
        </div>

        <div id="reaction-result" class="reaction-result">
            Your reaction time will appear here.
        </div>

        <div class="game-buttons">

            <button id="reaction-start" class="start-btn">
                Start Game
            </button>

            <a href="index.html" class="back-btn">
                Back
            </a>

        </div>

    </div>

    <script src="reaction.js"></script>

</body>
</html>
