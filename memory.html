<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🧠 Memory Game</h1>

        <p class="subtitle">
            Find and match all the pairs!
        </p>

        <!-- Game Information -->
        <div class="memory-info">

            <span>
                Moves:
                <b id="moves">0</b>
            </span>

            <span>
                Pairs:
                <b id="pairs">0</b>
            </span>

        </div>


        <!-- Memory Cards -->
        <div id="memory-board" class="memory-board">
        </div>


        <!-- Congratulations -->
        <div id="win-message" class="win-message">

            <h2>🎉 Congratulations!</h2>

            <p>
                You matched all the pairs!
            </p>

            <p>
                Total Moves:
                <b id="final-moves">0</b>
            </p>

        </div>


        <!-- Buttons -->
        <div class="game-buttons">

            <button id="restartBtn" class="start-btn">
                Restart Game
            </button>

            <a href="index.html" class="back-btn">
                Back
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
