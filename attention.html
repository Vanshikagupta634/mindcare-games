<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🎯 Attention Game</h1>

        <p class="subtitle">
            Find the different shape!
        </p>

        <div class="memory-info">
            <span>
                Score:
                <b id="score">0</b>
            </span>

            <span>
                Time:
                <b id="timer">30</b>s
            </span>
        </div>

        <div id="attention-board" class="attention-board">
        </div>

        <div class="game-buttons">

            <button id="startBtn" class="start-btn">
                Start Game
            </button>

            <a href="index.html" class="back-btn">
                Back
            </a>

        </div>

    </div>

    <script src="attention.js"></script>

</body>
</html>
